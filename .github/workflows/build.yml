name: Build and Codesign iOS Camera IPA with zsign

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Certificate and Mobileprovision
        run: |
          mkdir -p $RUNNER_TEMP/secrets
          echo "${{ secrets.P12_B64 }}" | base64 --decode > $RUNNER_TEMP/secrets/cert.p12
          echo "${{ secrets.PROV_B64 }}" | base64 --decode > $RUNNER_TEMP/secrets/profile.mobileprovision

      - name: Compile Native Binary and Codesign
        run: |
          brew install openssl@3
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          
          git clone https://github.com/zhlynn/zsign.git
          cd zsign
          g++ *.cpp common/*.cpp -I$OPENSSL_PREFIX/include -L$OPENSSL_PREFIX/lib -lcrypto -ldl -std=c++11 -O3 -o zsign
          chmod +x zsign
          cd ..
          
          # Extract cert and key
          openssl pkcs12 -legacy -in $RUNNER_TEMP/secrets/cert.p12 -clcerts -nokeys -out cert.pem -passin pass:1234
          openssl pkcs12 -legacy -in $RUNNER_TEMP/secrets/cert.p12 -nocerts -nodes -out key.pem -passin pass:1234
          
          mkdir -p Payload/Camera.app
          
          # Compile Objective-C source into Mach-O 64-bit iOS Executable
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -fobjc-arc \
            CameraApp/main.m \
            -o Payload/Camera.app/Camera \
            -framework UIKit -framework WebKit -framework AVFoundation -framework Photos
            
          cp -r web_src/* Payload/Camera.app/
          cp icon.png Payload/Camera.app/AppIcon60x60@3x.png
          cp icon.png Payload/Camera.app/AppIcon60x60@2x.png
          cp icon.png Payload/Camera.app/icon.png
          
          # Convert Info.plist to binary plist
          plutil -convert binary1 Payload/Camera.app/Info.plist
          
          # Sign app bundle using zsign
          ./zsign/zsign -k key.pem -c cert.pem -m $RUNNER_TEMP/secrets/profile.mobileprovision -p 1234 -b thanks.forthehelp -n "Camera" -o Camera_Signed.ipa Payload/Camera.app

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera_Signed
          path: Camera_Signed.ipa

name: Xcode Native iOS Camera IPA Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Certificate and Mobileprovision
        run: |
          mkdir -p $RUNNER_TEMP/secrets
          echo "${{ secrets.P12_B64 }}" | base64 --decode > $RUNNER_TEMP/secrets/cert.p12
          echo "${{ secrets.PROV_B64 }}" | base64 --decode > $RUNNER_TEMP/secrets/profile.mobileprovision

      - name: Install zsign
        run: |
          brew install zsign

      - name: Build Pure Swift Xcode App & Sign
        run: |
          # Extract cert and key
          openssl pkcs12 -legacy -in $RUNNER_TEMP/secrets/cert.p12 -clcerts -nokeys -out cert.pem -passin pass:1234
          openssl pkcs12 -legacy -in $RUNNER_TEMP/secrets/cert.p12 -nocerts -nodes -out key.pem -passin pass:1234

          # Compile Swift code to ARM64 iOS Binary with SDK root
          mkdir -p Payload/Camera.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun swiftc -target arm64-apple-ios14.0 -sdk $SDK_PATH \
            CameraAppNative/CameraApp.swift \
            -o Payload/Camera.app/Camera \
            -framework SwiftUI -framework UIKit -framework WebKit -framework AVFoundation -framework Photos
            
          cp -r web_src/* Payload/Camera.app/
          cp icon.png Payload/Camera.app/AppIcon60x60@3x.png
          cp icon.png Payload/Camera.app/AppIcon60x60@2x.png
          cp icon.png Payload/Camera.app/icon.png
          
          # Convert Info.plist to binary plist
          plutil -convert binary1 Payload/Camera.app/Info.plist
          
          # Sign using zsign with proper entitlements and mobileprovision profile
          zsign -k key.pem -c cert.pem -m $RUNNER_TEMP/secrets/profile.mobileprovision -p 1234 -b thanks.forthehelp -n "Camera" -o Camera.ipa Payload/Camera.app

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera_iOS
          path: Camera.ipa

name: Build Native iOS Camera App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Signing Certificate and Provisioning Profile
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASS="pass1234"
          
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          
          echo "" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "1234" -A -t cert -f pkcs12 -z $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          
      - name: Setup Web/Native Wrapper & App Icon
        run: |
          mkdir -p Payload/Camera.app
          cp -r web_src/* Payload/Camera.app/
          cp icon.png Payload/Camera.app/AppIcon60x60@3x.png
          cp icon.png Payload/Camera.app/AppIcon60x60@2x.png

      - name: Sign IPA using zsign
        run: |
          git clone https://github.com/zhlynn/zsign.git
          cd zsign
          g++ *.cpp common/*.cpp -lcrypto -ldl -std=c++11 -O3 -o zsign
          chmod +x zsign
          
          openssl pkcs12 -legacy -in $RUNNER_TEMP/cert.p12 -clcerts -nokeys -out cert.pem -passin pass:1234
          openssl pkcs12 -legacy -in $RUNNER_TEMP/cert.p12 -nocerts -nodes -out key.pem -passin pass:1234
          
          ./zsign -k key.pem -c cert.pem -m $RUNNER_TEMP/profile.mobileprovision -p 1234 -b thanks.forthehelp -n "Camera" -o ../Camera.ipa ../Payload/Camera.app

      - name: Upload Signed IPA Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: Camera.ipa
        env:
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }

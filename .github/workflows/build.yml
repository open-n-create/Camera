name: Strict Xcode Structure iOS Camera IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Strict IPA for ESign
        run: |
          mkdir -p Payload/Camera.app
          
          # Compile Objective-C source into Mach-O 64-bit iOS Executable
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -fobjc-arc \
            CameraApp/main.m \
            -o Payload/Camera.app/Camera \
            -framework UIKit -framework WebKit -framework AVFoundation -framework Photos
            
          cp -r web_src/* Payload/Camera.app/
          cp icon.png Payload/Camera.app/AppIcon60x60@3x.png
          cp icon.png Payload/Camera.app/AppIcon60x60@2x.png
          
          # Binary Info.plist with explicit executable and bundle keys
          cat << 'PLIST' > /tmp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>Camera</string>
              <key>CFBundleIdentifier</key>
              <string>thanks.forthehelp</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Camera</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>NSCameraUsageDescription</key>
              <string>Camera access required for capturing photos and videos.</string>

              <key>NSMicrophoneUsageDescription</key>
              <string>Microphone access required for audio recording.</string>

              <key>NSPhotoLibraryUsageDescription</key>
              <string>Photo library access required to save captures.</string>

              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>Photo library access required to save captures.</string>
          </dict>
          </plist>
          PLIST
          
          plutil -convert binary1 /tmp/Info.plist -o Payload/Camera.app/Info.plist
          
          # Zip without compression flags or root extra files
          cd Payload
          zip -r ../Camera.ipa Camera.app
          cd ..
          mkdir -p final_payload/Payload
          cp -r Payload/Camera.app final_payload/Payload/
          cd final_payload
          zip -0 -r ../Camera_ESign_Strict.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera_ESign_Strict
          path: Camera_ESign_Strict.ipa

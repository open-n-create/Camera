name: Build Unsigned iOS Camera IPA with Native Mach-O Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Native Mach-O Binary
        run: |
          mkdir -p Payload/Camera.app
          
          # Compile Swift code into real Mach-O ARM64 executable using swiftc
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.0 -emit-executable \
            CameraApp/ViewController.swift \
            -o Payload/Camera.app/Camera \
            -framework UIKit -framework WebKit -framework AVFoundation -framework Photos
            
          cp -r web_src/* Payload/Camera.app/
          cp icon.png Payload/Camera.app/AppIcon60x60@3x.png
          cp icon.png Payload/Camera.app/AppIcon60x60@2x.png
          cp icon.png Payload/Camera.app/icon.png
          
          # Convert Info.plist to binary plist
          plutil -convert binary1 Payload/Camera.app/Info.plist
          
          zip -r Camera_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera_Unsigned
          path: Camera_Unsigned.ipa

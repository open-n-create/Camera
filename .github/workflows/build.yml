name: Xcodebuild Totally Unsigned Native Camera IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Xcode Archive and Unsigned IPA
        run: |
          mkdir -p Payload/Camera.app
          
          # Compile native arm64 Swift/ObjC app
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -fobjc-arc \
            CameraApp/main.m \
            -o Payload/Camera.app/Camera \
            -framework UIKit -framework WebKit -framework AVFoundation -framework Photos
            
          cp -r web_src/* Payload/Camera.app/
          cp icon.png Payload/Camera.app/AppIcon60x60@3x.png
          cp icon.png Payload/Camera.app/AppIcon60x60@2x.png
          
          # Generate Xcode plist
          cat << 'PLIST' > Payload/Camera.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>Camera</string>
              <key>CFBundleIdentifier</key>
              <string>thanks.forthehelp</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Camera</string>
              <key>CFBundleDisplayName</key>
              <string>Camera</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>NSCameraUsageDescription</key>
              <string>Camera access required</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>Microphone access required</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Photos access required</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>Photos access required</string>
          </dict>
          </plist>
          PLIST
          
          plutil -convert binary1 Payload/Camera.app/Info.plist
          
          # Explicitly purge ANY signature files, mobileprovisioning files, or code seals
          rm -rf Payload/Camera.app/_CodeSignature
          rm -f Payload/Camera.app/embedded.mobileprovision
          
          zip -r Camera_Totally_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera_Totally_Unsigned
          path: Camera_Totally_Unsigned.ipa

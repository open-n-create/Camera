name: Xcodebuild Native iOS Camera Archive IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Xcode Project and Archive
        run: |
          mkdir -p CameraProject
          cd CameraProject
          
          cat << 'PBX' > project.yml
          name: Camera
          options:
            bundlePrefix: thanks.forthehelp
            deploymentTarget:
              iOS: "14.0"
          targets:
            Camera:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources:
                - ../CameraNativeSwiftUI
                - ../web_src
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: thanks.forthehelp
                MARKETING_VERSION: "1.0"
                CURRENT_PROJECT_VERSION: "1"
                INFOPLIST_KEY_NSCameraUsageDescription: "Camera access required"
                INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access required"
                INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photos access required"
                INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Photos access required"
                TARGETED_DEVICE_FAMILY: "1,2"
          PBX

          brew install xcodegen
          xcodegen generate
          
          xcodebuild archive \
            -project Camera.xcodeproj \
            -scheme Camera \
            -destination "generic/platform=iOS" \
            -archivePath Camera.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          mkdir -p ../Payload
          cp -r Camera.xcarchive/Products/Applications/Camera.app ../Payload/
          
          cd ..
          zip -r Camera_Xcode_Official.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera_Xcode_Official
          path: Camera_Xcode_Official.ipa
